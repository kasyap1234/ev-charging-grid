version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/storage/postgres/queries"
    gen:
      go:
        package: "db"
        out: "internal/storage/postgres/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "uuid"
            go_type: "uuid.UUID"