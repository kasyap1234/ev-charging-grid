services:
  # ----------------------------------------------------
  # PostgreSQL: Relational Database
  # ----------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: ev-charging-grid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ev_charging_grid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ev_charging_grid}
      POSTGRES_DB: ${POSTGRES_DB:-ev_charging_grid}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ev_charging_grid}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ev_charging_grid_network

  # ----------------------------------------------------
  # Redis: In-Memory Cache & Key-Value Store
  # ----------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: ev-charging-grid-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ev_charging_grid_network

  # ----------------------------------------------------
  # RabbitMQ: Message Broker with Web UI
  # ----------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ev-charging-grid-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ev_charging_grid_network

# ----------------------------------------------------
# Persistent Named Volumes
# ----------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

# ----------------------------------------------------
# Shared Network
# ----------------------------------------------------
networks:
  ev_charging_grid_network:
    driver: bridge