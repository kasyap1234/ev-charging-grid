# https://taskfile.dev
version: '3'

# Loads .env (if present) into every task's environment.
dotenv: ['.env']

env:
  # goose reads these env vars, so commands stay short (e.g. `goose up`).
  GOOSE_DRIVER: postgres
  GOOSE_MIGRATION_DIR: migrations
  # DSN resolution per field: $DB_* (used by internal/config) -> $POSTGRES_*
  # (used by docker-compose) -> docker-compose defaults. .env is sourced so
  # local overrides apply to goose too.
  GOOSE_DBSTRING:
    sh: set -a; [ -f .env ] && . ./.env; set +a; printf 'postgres://%s:%s@%s:%s/%s?sslmode=disable' "${DB_USER:-${POSTGRES_USER:-ev_charging_grid}}" "${DB_PASSWORD:-${POSTGRES_PASSWORD:-ev_charging_grid}}" "${DB_HOST:-localhost}" "${DB_PORT:-5432}" "${DB_NAME:-${POSTGRES_DB:-ev_charging_grid}}"

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  # -------------------- Setup --------------------

  setup:
    desc: Install dev tools (goose)
    cmds:
      - go install github.com/pressly/goose/v3/cmd/goose@latest

  # -------------------- Infra (docker compose) --------------------

  infra:up:
    desc: Start Postgres, Redis & RabbitMQ (waits for health checks)
    cmds:
      - docker compose up -d --wait

  infra:down:
    desc: Stop all compose services
    cmds:
      - docker compose down

  infra:ps:
    desc: Show compose service status
    cmds:
      - docker compose ps

  infra:logs:
    desc: Tail logs for all services, or one — task infra:logs postgres
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  infra:ui:
    desc: Open the RabbitMQ management UI (guest/guest)
    cmds:
      - open http://localhost:15672

  # -------------------- Migrations (goose) --------------------

  migrate:create:
    desc: Create a SQL migration — task migrate:create NAME=create_stations
    requires:
      vars: [NAME]
    cmds:
      - goose create {{.NAME}} sql

  migrate:up:
    desc: Apply all pending migrations
    cmds:
      - goose up

  migrate:up-by-one:
    desc: Apply only the next pending migration
    cmds:
      - goose up-by-one

  migrate:down:
    desc: Roll back the most recent migration
    cmds:
      - goose down

  migrate:down-to:
    desc: Roll back to a version — task migrate:down-to VERSION=0
    requires:
      vars: [VERSION]
    cmds:
      - goose down-to {{.VERSION}}

  migrate:redo:
    desc: Re-run the latest migration (down + up)
    cmds:
      - goose redo

  migrate:reset:
    desc: Roll back ALL migrations
    prompt: Roll back every migration? Data in migrated tables may be lost.
    cmds:
      - goose reset

  migrate:status:
    desc: Show applied/pending migrations
    cmds:
      - goose status

  migrate:version:
    desc: Print the current schema version
    cmds:
      - goose version

  migrate:validate:
    desc: Check migration files for errors without running them
    cmds:
      - goose validate

  migrate:fix:
    desc: Renumber migrations sequentially (resolves timestamp merge conflicts)
    cmds:
      - goose fix

  # -------------------- Database --------------------

  db:setup:
    desc: Start infra and apply all migrations
    cmds:
      - task: infra:up
      - task: migrate:up

  db:reset:
    desc: Wipe volumes, restart infra, re-run migrations (DESTRUCTIVE)
    prompt: Delete ALL data in the dev databases (postgres/redis/rabbitmq volumes)?
    cmds:
      - docker compose down -v
      - task: infra:up
      - task: migrate:up

  db:shell:
    desc: Open a psql shell inside the Postgres container
    cmds:
      - docker compose exec postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"'

  db:url:
    desc: Print the DSN goose connects with
    silent: true
    cmds:
      - echo "$GOOSE_DBSTRING"

  # -------------------- Go --------------------

  build:
    desc: Build cmd/api into ./bin
    cmds:
      - go build -o bin/api ./cmd/api

  run:
    desc: Run the api server (go run)
    cmds:
      - go run ./cmd/api

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test:cover:
    desc: Run tests and print coverage summary (writes coverage.out)
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  fmt:
    desc: Format all Go code (gofmt -s)
    cmds:
      - gofmt -s -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  tidy:
    desc: go mod tidy + verify
    cmds:
      - go mod tidy
      - go mod verify

  check:
    desc: vet + build + test
    cmds:
      - go vet ./...
      - go build ./...
      - go test ./...

  clean:
    desc: Remove build artifacts (bin/, coverage.out)
    cmds:
      - rm -rf bin coverage.out
